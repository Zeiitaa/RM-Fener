server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Jika request bukan file statis, arahkan ke index.html (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: caching file statis
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}